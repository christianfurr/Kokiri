name: Source and native app checks
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  public-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.14'
      - run: python scripts/check_publication.py --staged
      - run: python -m unittest discover -s tests -v
      - run: python -I -m unittest discover -s engine/tests -p test_standalone_build.py -v
      - name: Check shader preparation coverage and chunk receipts
        run: |
          python -I -m unittest discover -s engine/tests -p test_preparation_receipt.py -v
          python -I -m unittest discover -s engine/tests -p test_shader_seed.py -v
          python -I -m unittest discover -s engine/tests -p test_shader_seed_resume.py -v
          python -I -m unittest discover -s engine/tests -p test_compute_pipelines.py -v
          python -I -m unittest discover -s engine/tests -p test_pipeline_preparation_inputs.py -v
      - name: Check actual presentation certification
        run: python -I -m unittest discover -s engine/tests -p test_analyze_presented.py -v
      - name: Parse public Python source
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          paths = list(Path('engine').rglob('*.py')) + list(Path('scripts').glob('*.py'))
          for path in paths:
              ast.parse(path.read_text(), filename=str(path))
          print(f'{len(paths)} Python sources parsed')
          PY
  catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/catalog
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Check self-hosted HTTP, SQLite and bundled lifecycle
        env:
          KOKIRI_TEST_STAGE: ${{ runner.temp }}/kokiri-catalog-stage
        run: |
          node selfhost/build.mjs "$KOKIRI_TEST_STAGE"
          node --test --test-concurrency=1 tests/selfhost/*.test.mjs
      - run: npm run build
  native-app:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.14'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check locked observation and disposable-development MCP
        working-directory: tools/kokiri-mcp
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/kokiri-mcp-venv
        run: |
          python3 -m pip install --only-binary=:all: uv==0.8.3
          uv sync --locked --python python3
          uv run --locked python -B -m unittest discover -s tests -v -f
      - name: Check signed runtime update and diagnostic ownership
        env:
          KOKIRI_RELEASE_VENV: ${{ runner.temp }}/kokiri-release-venv
        run: |
          python3 -m venv "$KOKIRI_RELEASE_VENV"
          "$KOKIRI_RELEASE_VENV/bin/python" -m pip install --only-binary=:all: -r release/requirements.txt
          "$KOKIRI_RELEASE_VENV/bin/python" -m pip check
          "$KOKIRI_RELEASE_VENV/bin/python" -B -m unittest discover -s release -p 'test_*.py' -v
      - run: bash macos/test.sh
      - run: bash macos/build.sh
      - run: python3 -I -m unittest discover -s engine/tests -p test_oot_live_bridge.py -v
      - name: Check native development ownership and human takeover
        run: |
          python3 -I -m unittest discover -s engine/tests -p test_development_launcher.py -v
          python3 -I -m unittest discover -s engine/tests -p test_private_entry_gate.py -v
          python3 -I -m unittest discover -s engine/tests -p test_development_input.py -v
          python3 -I -m unittest discover -s engine/tests -p test_game_slot_takeover.py -v
          python3 -I -m unittest discover -s engine/tests -p test_human_preview_spawn.py -v
          python3 -I -m unittest discover -s engine/tests -p test_preview_screenshot.py -v
          python3 -I -m unittest discover -s engine/tests -p test_preview_archive_paths.py -v
      - run: python3 -I -m unittest discover -s engine/tests -p test_startup_view.py -v
      - run: python3 -I -m unittest discover -s engine/tests -p test_catalog_runtime.py -v
      - name: Check shader compiler identity and packaging gates
        run: |
          python3 -I -m unittest discover -s engine/tests -p test_shader_libraries.py -v
          python3 -I -m unittest discover -s engine/tests -p test_shader_package.py -v
      - name: Check private packaging and filesystem aliases on macOS
        run: python3 -I -m unittest discover -s engine/tests -p test_standalone_build.py -v
      - name: Check storage lifetime and synthetic audio
        run: |
          python3 -I -m unittest discover -s engine/tests -p test_storage_sweep.py -v
          python3 -I -m unittest discover -s engine/tests -p test_audio_renderer.py -v
      - name: Check actual archive library validation and renderer sources
        working-directory: engine
        run: |
          xcrun clang -std=gnu11 -fobjc-arc -fblocks -DGAME_OOT=1 -DGAME_NS2=1 -O0 -Wall -Wextra -Werror -Wno-unused-function -Wno-deprecated-declarations tests/archive_library_snapshot.m -framework Foundation -o "$RUNNER_TEMP/kokiri-archive-library-snapshot"
          "$RUNNER_TEMP/kokiri-archive-library-snapshot" "$RUNNER_TEMP/kokiri-archive-fixture-data"
          xcrun clang -O2 -g -Wall -Wextra -Wno-error -Wno-unused-function -Wno-unused-parameter -std=gnu11 -fobjc-arc -Ithird_party/d2r_gfx/gfx/nvn/include -Iruntime -DGAME_OOT=1 -DGAME_NS2=1 -DTOTK_CONTRIB_INBOX='""' -DTOTK_BOARD_URL='""' -DTOTK_NAME_URL='""' -DTOTK_SHOT_URL='""' -c third_party/d2r_gfx/gfx/nvn/nvn_mtl.m -o "$RUNNER_TEMP/kokiri-renderer.o"
          xcrun clang -std=gnu11 -fobjc-arc -Wall -Wextra -Wno-error -Wno-unused-function -Wno-unused-parameter -Ithird_party/d2r_gfx/gfx/nvn/include -Iruntime -DGAME_OOT=1 -DGAME_NS2=1 -DTOTK_CONTRIB_INBOX='""' -DTOTK_BOARD_URL='""' -DTOTK_NAME_URL='""' -DTOTK_SHOT_URL='""' -fsyntax-only third_party/d2r_gfx/gfx/nvn/totk_shader_rt.m
      - name: Check actual runtime UI source
        working-directory: engine
        run: |
          xcrun clang -fsyntax-only -std=c11 -Wall -Wextra -Werror -Wno-deprecated-declarations -fobjc-arc -DGAME_OOT=1 -DGAME_NS2=1 -Ithird_party/d2r_gfx/gfx/nvn/include -Iruntime app/launcher.m
          xcrun clang -fsyntax-only -std=c11 -Wall -Wextra -Werror -Wno-deprecated-declarations -DGAME_OOT=1 -DGAME_NS2=1 -Ithird_party/d2r_gfx/gfx/nvn/include -Iruntime runtime/input.c
          xcrun clang -fsyntax-only -std=c11 -Wall -Wextra -Werror -Wno-deprecated-declarations -fobjc-arc -DGAME_OOT=1 -DGAME_NS2=1 -Ithird_party/d2r_gfx/gfx/nvn/include -Iruntime runtime/frontend.m
